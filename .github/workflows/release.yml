name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) and this
# workflow tests, builds the Windows executables, and creates a DRAFT release
# with them attached. Review the draft on GitHub, edit the notes, then Publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload files to it

env:
  GOFLAGS: -mod=vendor

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Test
        run: go test ./...

      - name: Build executables
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/uv28prog-windows-$arch.exe" ./cmd/uv28prog
          done
          cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its files."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "$TAG" --generate-notes
          fi
