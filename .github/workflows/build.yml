name: Build

on:
  push:
    branches: ["**"] # all branches, but not tags (release.yml handles those)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the build that's still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependencies are vendored, so builds never touch the network.
  GOFLAGS: -mod=vendor

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Vet (Linux build)
        run: go vet ./...

      - name: Vet (Windows build)
        run: go vet ./...
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    env:
      BINARY: uv28prog-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "dist/$BINARY" ./cmd/uv28prog

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.BINARY }}
          archive: false
          if-no-files-found: error
